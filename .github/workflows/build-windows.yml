# Windows 版を GitHub の Windows マシンで作り、ダウンロードできる形で置く。
#
# 会場PCや予備機に Node.js を入れなくても、ブラウザから exe を落として
# 持って行けるようにするのが目的。開発は Linux なので、
# ここが「Windows で作った exe」を得られる唯一の場所でもある。
#
# アプリ自体は完全オフラインで動く（要件定義 §4）。
# ここでの通信はビルドのためだけで、アプリに外部通信は入らない。
name: Windows ビルド

on:
  push:
    branches:
      - main
      - claude/product-dev-guidelines-85ic9x
  workflow_dispatch:

permissions:
  # 「最新版」の置き場（Release）を書き換えるために要る
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 版番号をビルド番号にする。
      #
      # 更新の仕組みは「版番号が上がったか」で判断するので、毎回 0.1.0 のままだと
      # **新しい版だと気づけない**。ビルドのたびに必ず1つ上がるようにする。
      - name: 版番号をビルド番号にする
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "0.1.${{ github.run_number }}"

      - run: npm ci

      # exe を作る前に落とす。壊れたものを配らないため。
      - run: npm test

      # dist:win の中で typecheck と build も走る
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: PaintingsAquarium-windows
          path: |
            release/*.exe
            release/*.zip
          # 会期をまたいで取りに来られるだけの余裕を持たせる
          retention-days: 60
          if-no-files-found: error

      # 「最新版」の固定の置き場に上書きする。
      #
      # Artifacts は **GitHub にログインしないと落とせず、60日で消える**。
      # 会場PCから毎回ログインするのは現実的でないので、
      # ログイン不要の固定URLに常に最新の exe を置いておく。
      #   https://github.com/<owner>/<repo>/releases/tag/latest
      #
      # アプリ側には何も足していない（外部通信なし・要件定義 §4 のまま）。
      # 更新は「人が落として上書きする」ままで、置き場が変わるだけ。
      - name: 最新版として置く
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版 0.1.${{ github.run_number }}（自動ビルド）
          body: |
            ## 0.1.73 以前を使っている人へ

            **0.1.73 以前は、アプリの「更新」ボタンでは新しい版になりません。**
            落とすところまでしかできず、入れ替えは Windows に止められて
            何も起きないためです（直したのは 0.1.74 から）。

            **1回だけ手で入れ替えてください。** 下の `PaintingsAquarium-Setup.exe`
            を落として、そのまま実行するだけです（アンインストールは不要）。
            **絵と設定は消えません。** 一度 0.1.74 以降にすれば、
            次からは設定画面の「いま入れ替えて再起動する」で更新できます。

            ---

            ## ダウンロードできないときは `PaintingsAquarium.zip`

            **未署名なので、ブラウザが `.exe` を落とす段階で止めることがあります。**
            そのときは `.zip` を落としてください。**中身は同じです。**

            | ファイル | 使いどころ |
            |---|---|
            | `PaintingsAquarium.zip` | **exe が落とせないとき。** 展開して中の `PaintingsAquarium.exe` を叩くだけ。インストール不要。**絵はインストール版と同じ場所を使う**ので、そのまま続きから見られます |
            | `PaintingsAquarium-Setup.exe` | 会場PCに入れて使う（落とせるならこちらが楽） |
            | `PaintingsAquarium-portable.exe` | インストールできないPC用。USBから直接動く |

            zip は**右クリック →「すべて展開」**で開いてください。
            「ここに展開」だと 75 個のファイルがばらけます。

            ### 起動のときに警告が出たら

            「WindowsによってPCが保護されました」は未署名のため必ず出ます。
            **青い窓の左下に小さく灰色の「詳細情報」**があり、押すと「実行」が出ます。

            **USBメモリにコピーしてから起動すれば、そもそも出ません。**
            詳しくは `docs/警告が出て起動できないとき.md`。

            ### 印刷する台紙

            下のリンクを押すとそのまま落とせます（ログイン不要）。

            - [お絵かき台紙-全11枚.pdf](https://github.com/manakikido-jpg/PaintingsAquarium/raw/HEAD/docs/%E3%81%8A%E7%B5%B5%E3%81%8B%E3%81%8D%E5%8F%B0%E7%B4%99-%E5%85%A811%E6%9E%9A.pdf) — 全部まとめて（下見・試し刷り用）
            - [お絵かき水族館-台紙.pdf](https://github.com/manakikido-jpg/PaintingsAquarium/raw/HEAD/docs/%E3%81%8A%E7%B5%B5%E3%81%8B%E3%81%8D%E6%B0%B4%E6%97%8F%E9%A4%A8-%E5%8F%B0%E7%B4%99.pdf) — 会期で刷るのはこちら（6ページ）
            - [お絵かきダイナソー-台紙.pdf](https://github.com/manakikido-jpg/PaintingsAquarium/raw/HEAD/docs/%E3%81%8A%E7%B5%B5%E3%81%8B%E3%81%8D%E3%83%80%E3%82%A4%E3%83%8A%E3%82%BD%E3%83%BC-%E5%8F%B0%E7%B4%99.pdf) — 同上（5ページ）

            **A4・よこ・等倍**で刷ってください（「用紙に合わせる」は切る／両面にしない）。

            ### そのほか

            **ファイル名は毎回同じです。** いまの版は設定画面（`S` キー）に出ます。

            上書きしても**絵と設定は消えません**。
            保存先はアプリとは別（インストール版は `%APPDATA%`、持ち運び版は exe の隣）。
          # 「いちばん新しい版」として扱わせる。
          # 下書き扱い（prerelease）にすると、更新の確認から見えなくなる
          prerelease: false
          make_latest: true
          # latest.yml も置く。更新の仕組みがこれを見て新しい版か判断する
          # **台紙の PDF はここに置かない。** 下の説明文からリンクする。
          #
          # 一度ここに並べたら、置き場の更新が毎回失敗するようになった（run 87〜88）。
          # 既にあるファイルは「消す→上げ直す→ラベルを戻す」の順で処理されるが、
          # その最後で `Not Found`（update-a-release-asset）になる。
          # 日本語の名前のファイルで起きていた。
          #
          # 台紙はアプリと違って毎回変わらないので、ビルドのたびに上げ直す意味も無い。
          # リポジトリの中のものが Public でそのまま落とせる（確認済み）。
          files: |
            release/*.exe
            release/*.zip
            release/latest.yml

      # 古い版のファイルを消す。
      #
      # 名前に版番号が入っていた頃のファイルが残ると、会場で
      # 「どれを落とすのか」が分からなくなる。置くのは keep に並べたものだけにする。
      - name: 古いファイルを消す
        if: github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # **名前ではなく id で消す（R-052）。**
          #
          # 名前で回していたら、日本語の名前の PDF が Windows のシェルを通る間に
          # `-.11.pdf` に化けた。`-` で始まるので `gh` がフラグと解釈して落ちる:
          #     unknown shorthand flag: '.' in -.11.pdf
          #
          # 残すかどうかの判定は **jq の中**でやる。あそこは UTF-8 のまま扱えるので、
          # 名前がどんな文字でも壊れない。シェルを渡るのは数字の id だけになる。
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '
            .assets[]
            | select(["PaintingsAquarium.zip",
                      "PaintingsAquarium-Setup.exe",
                      "PaintingsAquarium-portable.exe",
                      "latest.yml"] | index(.name) | not)
            | "\(.id) \(.name)"' \
          | while IFS=' ' read -r id name; do
              echo "消す: $name (id=$id)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            done
