appId: jp.paintingsaquarium.app
productName: PaintingsAquarium
copyright: PaintingsAquarium

directories:
  output: release
  buildResources: build

# ビルド済みのものだけを詰める。src や docs を入れても動作に関係なく、
# 会場PCへ配るファイルが無駄に大きくなる。
files:
  - dist/**
  - dist-electron/**
  - package.json

# 更新の置き場。**自動では見に行かない。**
# 設定画面の「更新を確認」を押したときだけ通信する（2026-08-18 決定）。
# 会期中は誰も押さないので、実質これまでどおり外部通信なしで動く。
#
# ここを書いておくと、ビルド時に latest.yml も作られる。
# 更新の仕組みは、その latest.yml を見て新しい版かどうかを判断する。
#
# **ビルドでは公開しない**（`dist:win` に `--publish never` を付けてある）。
# これを外すと electron-builder が自分で公開しようとし、
# トークンが無くてビルドごと落ちる（実際に落ちた）。
# 置き場への上書きは Actions 側でやる。
publish:
  provider: github
  owner: manakikido-jpg
  repo: PaintingsAquarium

win:
  target:
    - target: nsis
      arch: [x64]
    # 会場PCにインストールできない（管理者に止められている・借り物）ことがあるので、
    # exe 1個で動く版も一緒に作る。USB に入れて別PCへ持って行けるようにするため。
    - target: portable
      arch: [x64]
    # **exe ではない形も置く。**
    #
    # 会場から「詳細からダウンロードもできない」と言われた。
    # Edge は未署名の .exe を**落とす段階で**止める。「保持する」は
    # ダウンロード一覧の「…」の奥にあり、組織のポリシーでは消えていることもある。
    # そうなると exe はどうやっても手に入らない。
    #
    # .zip は同じ中身でも止められにくい。中は win-unpacked と同じ一式で、
    # 展開して PaintingsAquarium.exe を叩けばインストール無しで動く。
    - target: zip
      arch: [x64]
  # zip の名前を固定する。nsis と portable は下に自分の名前を持っているので、
  # ここで決まるのは zip だけ。版番号を入れない理由は下の portable と同じ
  artifactName: PaintingsAquarium.${ext}
  # 署名証明書は買っていない。未署名なので SmartScreen の警告が出る。
  # 会場PC1台に対して年数万円の証明書は見合わないと判断した（要件定義 §8）。
  signAndEditExecutable: true

# ファイル名に版番号を入れない。
#
# 入れると「最新版」の置き場に**ビルドのたびに別名のファイルが積み上がり**、
# 会場で「どれを落とすのか」が分からなくなる（実際に 0.1.0 と 0.1.38 が並んだ）。
# 名前を固定すれば、毎回同じ2つが上書きされる。
# いまの版は設定画面（S キー）に出る。
portable:
  artifactName: PaintingsAquarium-portable.${ext}

nsis:
  artifactName: PaintingsAquarium-Setup.${ext}
  oneClick: false
  # 会場PCが管理者権限で使えないことがあるため、ユーザー単位で入れられるようにする。
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: お絵かき水族館
