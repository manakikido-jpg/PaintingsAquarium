appId: jp.paintingsaquarium.app
productName: PaintingsAquarium
copyright: PaintingsAquarium

directories:
  output: release
  buildResources: build

# ビルド済みのものだけを詰める。src や docs を入れても動作に関係なく、
# 会場PCへ配るファイルが無駄に大きくなる。
files:
  - dist/**
  - dist-electron/**
  - package.json

# 更新の置き場。**自動では見に行かない。**
# 設定画面の「更新を確認」を押したときだけ通信する（2026-08-18 決定）。
# 会期中は誰も押さないので、実質これまでどおり外部通信なしで動く。
#
# ここを書いておくと、ビルド時に latest.yml も作られる。
# 更新の仕組みは、その latest.yml を見て新しい版かどうかを判断する。
#
# **ビルドでは公開しない**（`dist:win` に `--publish never` を付けてある）。
# これを外すと electron-builder が自分で公開しようとし、
# トークンが無くてビルドごと落ちる（実際に落ちた）。
# 置き場への上書きは Actions 側でやる。
publish:
  provider: github
  owner: manakikido-jpg
  repo: PaintingsAquarium

win:
  target:
    - target: nsis
      arch: [x64]
    # 会場PCにインストールできない（管理者に止められている・借り物）ことがあるので、
    # exe 1個で動く版も一緒に作る。USB に入れて別PCへ持って行けるようにするため。
    - target: portable
      arch: [x64]
  # 署名証明書は買っていない。未署名なので SmartScreen の警告が出る。
  # 会場PC1台に対して年数万円の証明書は見合わないと判断した（要件定義 §8）。
  signAndEditExecutable: true

portable:
  # 既定名は「PaintingsAquarium 0.1.0.exe」で、インストーラの
  # 「PaintingsAquarium Setup 0.1.0.exe」と 1 語しか違わない。
  # 会場で取り違えると原因が分かりにくいので、はっきり分ける。
  artifactName: PaintingsAquarium-${version}-portable.${ext}

nsis:
  oneClick: false
  # 会場PCが管理者権限で使えないことがあるため、ユーザー単位で入れられるようにする。
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: お絵かき水族館
